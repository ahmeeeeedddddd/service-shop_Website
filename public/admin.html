<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - El Ansary</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { 
            background-color: var(--bg-alt); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-page-wrapper {
            width: 100%;
            max-width: 600px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            width: 100%;
        }
        body.rtl .admin-header {
            flex-direction: row-reverse;
        }
        .admin-container {
            background: var(--bg-card);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-hover);
            border: 1px solid rgba(0,0,0,0.05);
            width: 100%;
        }
        .admin-title {
            text-align: center;
            margin-bottom: 40px;
            color: var(--text-main);
            font-size: 2.2rem;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        body.rtl .form-group {
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--text-main);
            font-size: 1.1rem;
        }
        .form-group input[type="text"], 
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #EEE;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition-fast);
            background-color: #FAFAFA;
        }
        .form-group input[type="text"]:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-yellow);
            background-color: #FFF;
            box-shadow: 0 0 10px var(--primary-yellow-glow);
        }
        .form-group input[type="file"] {
            width: 100%;
            padding: 15px;
            background: #FAFAFA;
            border: 2px dashed #CCC;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            color: var(--text-muted);
            transition: var(--transition-fast);
        }
        .form-group input[type="file"]:hover {
            border-color: var(--primary-red);
            background: #FFF;
        }
        .btn-upload {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            padding: 18px;
        }
        .btn-back {
            background: transparent;
            color: var(--text-muted);
            box-shadow: none;
            border: 2px solid #ddd;
        }
        .btn-back:hover {
            background: #eee;
            color: var(--text-main);
            box-shadow: none;
            transform: translateY(0);
        }
    </style>
</head>
<body class="rtl">
    <div class="admin-page-wrapper">
        <div class="admin-header">
            <a href="/" id="adminBackToSite" class="btn-primary btn-back">العودة للموقع</a>
            <button id="langToggle" class="lang-toggle" onclick="toggleLanguage()">English</button>
        </div>

        <div class="admin-container">
            <h2 id="adminTitle" class="admin-title">لوحة التحكم - رفع نموذج</h2>
            
            <form id="uploadForm">
                <div class="form-group">
                    <label for="title" id="adminUploadTitle">العنوان (اختياري)</label>
                    <input type="text" id="title" name="title" placeholder="أدخل عنوان الإصلاح (اختياري)...">
                </div>
                
                <div class="form-group">
                    <label for="description" id="adminUploadDesc">الوصف (اختياري)</label>
                    <textarea id="description" name="description" rows="4" placeholder="أدخل وصف تفصيلي للإصلاح (اختياري)..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="media" id="adminUploadMedia">فيديو / صورة</label>
                    <input type="file" id="media" name="media" accept="image/*,video/*" required>
                </div>
                
                <button type="submit" class="btn-primary btn-upload" id="adminUploadBtn">رفع</button>
            </form>
            <div id="statusMessage" style="margin-top: 25px; text-align: center; font-weight: bold; font-size: 1.1rem;"></div>
        </div>

        <!-- Manage Customer Reviews Section -->
        <div class="admin-container" style="margin-top: 30px;">
            <h3 id="adminManageReviewsTitle" style="text-align: center; margin-bottom: 25px; font-size: 1.6rem; color: var(--text-main);">إدارة آراء العملاء (حذف التعليقات)</h3>
            <div id="adminReviewsList" class="admin-reviews-list">
                <!-- Dynamically loaded reviews with Delete button -->
            </div>
        </div>
    </div>

    <script type="module">
        import translations from './js/translations.js';
        
        let currentLang = 'ar';
        const elementsToTranslate = ['adminTitle', 'adminUploadTitle', 'adminUploadDesc', 'adminUploadMedia', 'adminUploadBtn', 'adminBackToSite', 'langToggle'];

        function updateLanguage(lang) {
            currentLang = lang;
            const body = document.body;
            body.className = lang === 'ar' ? 'rtl' : 'ltr';
            
            elementsToTranslate.forEach(id => {
                const el = document.getElementById(id);
                if (el && translations[lang][id]) {
                    el.textContent = translations[lang][id];
                }
            });

            // Update placeholders
            const titleInput = document.getElementById('title');
            const descInput = document.getElementById('description');
            if (lang === 'ar') {
                titleInput.placeholder = "أدخل عنوان الإصلاح (اختياري)...";
                descInput.placeholder = "أدخل وصف تفصيلي للإصلاح (اختياري)...";
            } else {
                titleInput.placeholder = "Enter repair title (Optional)...";
                descInput.placeholder = "Enter detailed repair description (Optional)...";
            }

            fetchAdminReviews();
        }

        window.toggleLanguage = () => {
            updateLanguage(currentLang === 'ar' ? 'en' : 'ar');
        };

        async function fetchAdminReviews() {
            try {
                const res = await fetch('/api/reviews');
                const reviews = await res.json();
                const list = document.getElementById('adminReviewsList');
                if (!list) return;

                if (reviews.length === 0) {
                    list.innerHTML = `<p style="text-align: center; color: var(--text-muted);">${currentLang === 'ar' ? 'لا توجد تعليقات حالياً' : 'No comments currently'}</p>`;
                    return;
                }

                list.innerHTML = '';
                reviews.forEach(review => {
                    const item = document.createElement('div');
                    item.className = 'admin-review-item';
                    item.innerHTML = `
                        <div class="admin-review-details">
                            <strong style="font-size: 1.1rem; color: var(--text-main);">${review.name}</strong>
                            <p style="margin: 5px 0; color: #444;">${review.comment}</p>
                            <small style="color: var(--text-muted);">${review.date || ''}</small>
                        </div>
                        <button class="btn-delete" data-id="${review.id}">${currentLang === 'ar' ? 'حذف' : 'Delete'}</button>
                    `;

                    item.querySelector('.btn-delete').addEventListener('click', async () => {
                        const confirmMsg = currentLang === 'ar' ? 'هل أنت متأكد من حذف هذا التعليق؟' : 'Are you sure you want to delete this comment?';
                        if (confirm(confirmMsg)) {
                            await deleteReview(review.id);
                        }
                    });

                    list.appendChild(item);
                });
            } catch (err) {
                console.error('Error fetching admin reviews:', err);
            }
        }

        async function deleteReview(id) {
            try {
                const res = await fetch(`/api/reviews/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchAdminReviews();
                } else {
                    alert(currentLang === 'ar' ? 'فشل حذف التعليق' : 'Failed to delete comment');
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateLanguage(currentLang);
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const statusDiv = document.getElementById('statusMessage');
            
            statusDiv.textContent = currentLang === 'ar' ? 'جاري الرفع...' : 'Uploading...';
            statusDiv.style.color = 'var(--primary-yellow)';

            try {
                const res = await fetch('/api/repairs', {
                    method: 'POST',
                    body: formData
                });
                
                if (res.ok) {
                    statusDiv.textContent = currentLang === 'ar' ? 'تم الرفع بنجاح!' : 'Upload Successful!';
                    statusDiv.style.color = 'green';
                    e.target.reset();
                } else {
                    const data = await res.json();
                    statusDiv.textContent = data.error || (currentLang === 'ar' ? 'حدث خطأ' : 'Error occurred');
                    statusDiv.style.color = 'var(--primary-red)';
                }
            } catch (err) {
                statusDiv.textContent = currentLang === 'ar' ? 'حدث خطأ في الاتصال' : 'Connection error';
                statusDiv.style.color = 'var(--primary-red)';
            }
        });
    </script>
</body>
</html>
