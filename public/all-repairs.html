<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Repairs - El Ansary Service Center</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-header {
            background: var(--bg-card);
            padding: 20px 0;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden; /* For gears */
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        body.rtl .header-content {
            flex-direction: row-reverse;
        }
        .logo-small img {
            height: 130px; /* Big logo */
            transition: var(--transition-smooth);
        }
        .logo-small img:hover {
            transform: scale(1.05);
        }
        .main-content {
            padding: 60px 0;
            background: var(--bg-alt);
            min-height: 80vh;
        }
        @media (max-width: 900px) {
            .header-content { flex-direction: column; gap: 15px; }
            .logo-small img { height: 90px; }
        }
    </style>
</head>
<body class="rtl">

    <div class="page-header">
        <!-- Decorative SVGs -->
        <svg class="hero-decor gear1" style="top: -150px; right: -50px; opacity: 0.05;" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
        <svg class="hero-decor wrench1" style="bottom: -100px; left: -50px; opacity: 0.05;" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.5 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>

        <div class="container header-content">
            <a href="/" class="logo-small"><img src="/assets/Logo.png" alt="El Ansary Logo"></a>
            <div style="display: flex; gap: 15px;">
                <button id="langToggle" class="lang-toggle" onclick="toggleLanguage()">English</button>
                <a href="/" id="adminBackToSite" class="btn-primary" style="padding: 10px 20px;">العودة للموقع</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="section-title">
                <h2 id="repairsTitle">جميع الإصلاحات</h2>
            </div>
            
            <!-- No data-limit attribute here, so it will show all repairs -->
            <div class="repairs-grid" id="repairs-container">
                <!-- dynamically loaded from backend -->
            </div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
